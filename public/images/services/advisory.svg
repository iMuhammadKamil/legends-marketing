<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d2e" />
      <stop offset="100%" stop-color="#051812" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24b" />
      <stop offset="100%" stop-color="#fff1c2" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <g opacity="0.1">
    <circle cx="200" cy="150" r="180" fill="#fff" />
    <circle cx="1000" cy="450" r="220" fill="#c9a24b" />
    <line x1="100" y1="0" x2="100" y2="600" stroke="#fff" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="1100" y1="0" x2="1100" y2="600" stroke="#fff" stroke-width="1" stroke-dasharray="8 8" />
  </g>
  <rect x="50" y="50" width="1100" height="500" rx="16" fill="none" stroke="rgba(201,162,75,0.3)" stroke-width="1.5" />
  
  <!-- Icon / Monogram -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="90" height="90" rx="18" fill="rgba(6,35,27,0.85)" stroke="#c9a24b" stroke-width="2" />
    <text x="45" y="56" fill="#e2c878" font-family="Georgia, serif" font-size="34" font-weight="bold" text-anchor="middle">AD</text>
  </g>

  <!-- Badge -->
  <g transform="translate(210, 110)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(201,162,75,0.2)" stroke="#c9a24b" stroke-width="1" />
    <text x="110" y="21" fill="#e2c878" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">INVESTOR SERVICES</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(100, 240)">
    <text x="0" y="60" fill="#ffffff" font-family="Georgia, serif" font-size="44" font-weight="bold">Investor Advisory</text>
    <text x="0" y="110" fill="#e2c878" font-family="Segoe UI, sans-serif" font-size="22" font-weight="500">Dedicated Long-Term Wealth Consulting</text>
  </g>
  
  <g transform="translate(1000, 420)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="rgba(6,35,27,0.9)" stroke="#c9a24b" stroke-width="2" />
    <text x="50" y="62" fill="#c9a24b" font-family="Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle">LM</text>
  </g>
</svg>