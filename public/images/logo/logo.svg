<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Radial & Linear Gradients -->
    <radialGradient id="bgGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e7e5d" />
      <stop offset="35%" stop-color="#125942" />
      <stop offset="75%" stop-color="#083325" />
      <stop offset="100%" stop-color="#031a13" />
    </radialGradient>

    <!-- Metallic Script Silver/Platinum Gradient -->
    <linearGradient id="silverScript" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f0faf6" />
      <stop offset="70%" stop-color="#d2ece2" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Gold Edge Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(226, 200, 120, 0.7)" />
      <stop offset="50%" stop-color="rgba(201, 162, 75, 0.25)" />
      <stop offset="100%" stop-color="rgba(226, 200, 120, 0.5)" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Logo Squircle -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Shadow & Border -->
  <rect
    x="36"
    y="36"
    width="440"
    height="440"
    rx="112"
    ry="112"
    fill="url(#bgGlow)"
    stroke="url(#goldBorder)"
    stroke-width="2.5"
    filter="url(#cardShadow)"
  />

  <!-- Subtle Top Highlight Rim -->
  <path
    d="M 148 38 Q 256 40 364 38"
    stroke="rgba(255, 255, 255, 0.35)"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Signature Cursive Script "Legends" Vector Group -->
  <g id="legends-script" filter="url(#softGlow)">
    <!-- Capital 'L' -->
    <path
      d="M 125 315
         C 105 315, 96 302, 102 282
         C 109 255, 130 200, 155 140
         C 163 120, 172 108, 184 110
         C 194 112, 195 128, 185 158
         C 168 208, 142 278, 135 305
         C 133 312, 140 316, 154 312
         C 175 306, 202 290, 222 280
         C 228 277, 235 285, 226 292
         C 202 312, 165 324, 135 324
         C 129 324, 126 320, 125 315 Z"
      fill="url(#silverScript)"
    />

    <!-- Lowercase 'e' (first) -->
    <path
      d="M 215 285
         C 225 270, 240 252, 256 252
         C 268 252, 274 262, 268 274
         C 258 294, 230 305, 210 305
         C 198 305, 206 292, 215 285 Z
         M 252 265
         C 255 258, 250 256, 244 259
         C 235 264, 225 274, 218 284
         C 236 280, 248 273, 252 265 Z"
      fill="url(#silverScript)"
    />

    <!-- Lowercase 'g' with elegant descender loop -->
    <path
      d="M 270 278
         C 278 260, 296 250, 312 250
         C 328 250, 332 264, 324 282
         C 314 304, 290 312, 276 312
         C 270 312, 268 308, 270 298
         C 272 288, 270 282, 270 278 Z
         M 302 260
         C 292 260, 282 270, 278 284
         C 285 285, 296 282, 304 274
         C 309 268, 308 260, 302 260 Z
         M 324 268
         L 316 296
         C 306 332, 290 382, 265 405
         C 248 420, 232 416, 235 398
         C 240 372, 272 338, 310 310
         C 318 304, 324 308, 320 315
         C 286 342, 256 374, 252 394
         C 250 404, 258 404, 268 395
         C 286 378, 302 334, 312 298
         L 322 266
         C 325 258, 332 262, 324 268 Z"
      fill="url(#silverScript)"
    />

    <!-- Lowercase 'e' (second) -->
    <path
      d="M 326 285
         C 336 270, 351 252, 367 252
         C 379 252, 385 262, 379 274
         C 369 294, 341 305, 321 305
         C 309 305, 317 292, 326 285 Z
         M 363 265
         C 366 258, 361 256, 355 259
         C 346 264, 336 274, 329 284
         C 347 280, 359 273, 363 265 Z"
      fill="url(#silverScript)"
    />

    <!-- Lowercase 'n' -->
    <path
      d="M 372 284
         C 378 268, 386 255, 396 255
         C 406 255, 408 265, 402 278
         L 394 298
         C 392 304, 396 306, 402 300
         C 412 290, 420 274, 424 256
         C 426 248, 434 252, 432 260
         C 426 282, 414 305, 398 312
         C 386 316, 378 308, 382 294
         L 388 278
         C 390 272, 386 268, 380 274
         C 372 282, 366 294, 362 305
         C 360 310, 354 306, 356 300
         L 368 270
         C 370 264, 376 268, 372 284 Z"
      fill="url(#silverScript)"
    />

    <!-- Lowercase 'd' with high ascender -->
    <path
      d="M 436 278
         C 432 262, 444 252, 456 252
         C 466 252, 470 262, 466 274
         L 480 178
         C 482 165, 492 168, 488 182
         L 468 286
         C 464 304, 452 312, 438 312
         C 426 312, 422 300, 426 288
         C 430 276, 438 274, 436 278 Z
         M 456 264
         C 448 264, 442 272, 438 284
         C 436 292, 440 298, 446 298
         C 454 298, 460 290, 464 278
         C 466 270, 462 264, 456 264 Z"
      fill="url(#silverScript)"
    />

    <!-- Lowercase 's' -->
    <path
      d="M 468 296
         C 475 284, 486 274, 496 274
         C 504 274, 506 282, 498 290
         C 488 300, 478 308, 468 312
         C 460 315, 458 308, 464 300
         Z"
      fill="url(#silverScript)"
      transform="translate(-25, 0)"
    />
  </g>

  <!-- Dynamic Underline Flourish -->
  <path
    d="M 140 340
       C 220 338, 320 326, 420 310
       C 432 308, 435 316, 422 319
       C 318 342, 215 352, 136 348
       C 126 347, 128 340, 140 340 Z"
    fill="url(#silverScript)"
    opacity="0.85"
    filter="url(#softGlow)"
  />
</svg>
