<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad_Sector View" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2d23" />
      <stop offset="60%" stop-color="#051812" />
      <stop offset="100%" stop-color="#050a08" />
    </linearGradient>
    <linearGradient id="goldGrad_Sector View" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24b" />
      <stop offset="100%" stop-color="#fff0be" />
    </linearGradient>
    <linearGradient id="glass_Sector View" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <linearGradient id="mountain1_Sector View" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c7457" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0a3d2e" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ground_Sector View" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a3d2e" />
      <stop offset="100%" stop-color="#020806" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="800" fill="url(#skyGrad_Sector View)" />

  <!-- Stars / Tech Grid -->
  <g opacity="0.15">
    <circle cx="150" cy="120" r="1.5" fill="#fff" />
    <circle cx="280" cy="80" r="2" fill="#fff" />
    <circle cx="450" cy="160" r="1.5" fill="#fff" />
    <circle cx="720" cy="90" r="2" fill="#fff" />
    <circle cx="890" cy="140" r="1.5" fill="#fff" />
    <circle cx="1050" cy="110" r="2" fill="#fff" />
    <line x1="0" y1="520" x2="1200" y2="520" stroke="rgba(255,255,255,0.1)" stroke-dasharray="8 8" />
  </g>

  <!-- Background Mountains / Hills Silhouette -->
  <path d="M0,520 L0,380 Q180,260 360,340 T720,290 T1080,360 Q1140,380 1200,350 L1200,560 Z" fill="url(#mountain1_Sector View)" />
  <path d="M0,540 L0,420 Q240,320 480,410 T960,370 Q1080,390 1200,430 L1200,600 Z" fill="#0a3d2e" opacity="0.85" />

  <!-- Architectural Buildings / Villas / Towers -->
  <rect x="220" y="240" width="90" height="320" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <g fill="#c9a24b" opacity="0.6">
    <rect x="235" y="260" width="16" height="10" rx="1" />
    <rect x="260" y="260" width="16" height="10" rx="1" />
    <rect x="285" y="260" width="10" height="10" rx="1" />
    <rect x="235" y="290" width="16" height="10" rx="1" />
    <rect x="260" y="290" width="16" height="10" rx="1" />
    <rect x="285" y="290" width="10" height="10" rx="1" />
    <rect x="235" y="320" width="16" height="10" rx="1" />
    <rect x="260" y="320" width="16" height="10" rx="1" />
    <rect x="285" y="320" width="10" height="10" rx="1" />
  </g>

  <!-- Central Luxury Villa / Gate Structure -->
  <rect x="360" y="300" width="220" height="260" rx="6" fill="rgba(255,255,255,0.12)" stroke="#c9a24b" stroke-width="2" />
  <polygon points="340,300 470,200 600,300" fill="url(#glass_Sector View)" stroke="#c9a24b" stroke-width="2" />
  <rect x="430" y="420" width="80" height="140" rx="4" fill="rgba(6,35,27,0.8)" stroke="url(#goldGrad_Sector View)" stroke-width="2" />

  <!-- Modern Luxury Tower 2 -->
  <rect x="630" y="200" width="120" height="360" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <line x1="690" y1="200" x2="690" y2="560" stroke="#c9a24b" stroke-width="2" />

  <!-- Villa 3 -->
  <rect x="800" y="340" width="180" height="220" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <polygon points="780,340 890,260 1000,340" fill="url(#glass_Sector View)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Ground Landscape & Boulevard -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#ground_Sector View)" />
  
  <!-- Grand Avenue / Boulevard Perspective -->
  <polygon points="600,560 400,800 800,800" fill="rgba(255,255,255,0.04)" stroke="rgba(201,162,75,0.4)" stroke-width="1.5" />
  <line x1="600" y1="560" x2="600" y2="800" stroke="#c9a24b" stroke-width="2" stroke-dasharray="14 14" />

  <!-- Palm Trees Silhouettes -->
  <g fill="#1c7457">
    <path d="M150,560 Q155,480 160,440 Q130,420 110,430 Q140,410 160,435 Q170,400 165,435 Q190,415 180,440 Z" />
    <path d="M1020,560 Q1015,480 1010,440 Q980,420 960,430 Q990,410 1010,435 Q1020,400 1015,435 Q1040,415 1030,440 Z" />
  </g>

  <!-- Overlay Badge & Text Box -->
  <rect x="60" y="60" width="1080" height="680" rx="16" fill="none" stroke="rgba(201,162,75,0.25)" stroke-width="1" />

  <!-- Top Ribbon Banner -->
  <g transform="translate(90, 90)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="rgba(6,35,27,0.85)" stroke="#c9a24b" stroke-width="1.5" />
    <text x="95" y="23" fill="#c9a24b" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">SECTOR VIEW</text>
  </g>

  <!-- Title & Subtitle Card Overlay (Bottom Left) -->
  <g transform="translate(90, 600)">
    <rect x="0" y="0" width="620" height="110" rx="12" fill="rgba(6,35,27,0.88)" stroke="rgba(201,162,75,0.4)" stroke-width="1.5" />
    <text x="24" y="42" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="bold">Capital Smart City</text>
    <text x="24" y="74" fill="#c9a24b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="500">Crystal Lake & Executive Living</text>
  </g>

  <!-- Legends Marketing Official Monogram (Top Right) -->
  <g transform="translate(1030, 90)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="rgba(6,35,27,0.9)" stroke="#c9a24b" stroke-width="2" />
    <text x="40" y="50" fill="#c9a24b" font-family="Georgia, serif" font-size="32" font-weight="bold" text-anchor="middle">LM</text>
  </g>
</svg>